# Render Blueprint for the web backend (server/). Render → New → Blueprint → this repo.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: voice-agent-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false
      # Own GPT-Live voices (prompt-generated, tied to the OpenAI project of the key); empty → the preset voice.
      - key: OPENAI_VOICE_TARAS
        sync: false
      - key: OPENAI_VOICE_TOLIK
        sync: false
      - key: OPENAI_VOICE_KISHKA
        sync: false
      - key: PUBLIC_BACKEND_URL # e.g. https://voice-agent-backend.onrender.com
        sync: false
      - key: FRONTEND_ORIGINS # e.g. https://voice-agent.vercel.app (comma-separated)
        sync: false
      - key: LOGS_TOKEN # password of the hidden /logs page (calls and tool calls); empty = logs are open
        sync: false
      - key: TIMEZONE # for «сьогодні» and the time of day in the prompts
        value: Europe/Kyiv
      - key: WEB_SEARCH_API_KEY # Tavily, for the web_search tool; empty = she says search is unavailable
        sync: false
      - key: DATABASE_URL # Neon Postgres for «Знання» (postgresql://…?sslmode=require); empty = a SQLite file every deploy wipes
        sync: false
      - key: AUDD_API_TOKEN # «Музика» → Шазам (AudD); empty = recognition says it is not set up
        sync: false
      - key: OPENROUTER_API_KEY # «Музика» → new songs: Lyria via OpenRouter (free variant first)
        sync: false
      - key: GEMINI_API_KEY # «Музика» → new songs: Lyria straight from Gemini, the last in the chain
        sync: false
      - key: ELEVENLABS_API_KEY # «Музика» → new songs: ElevenLabs Music (the free plan: 10 000 credits a month)
        sync: false
      - key: ELEVENLABS_LENGTH_S # song length, seconds (10–300; 0 = the model decides); shorter = cheaper
        value: "60"
      - key: MUSIC_BY_VOICE # «Музика» by voice (recognize/generate/play): off, the panel only; true brings it back
        value: "false"
      - key: MUSIC_MODELS # the fallback chain, comma-separated «openrouter:<model>» / «gemini:<model>»
        value: openrouter:google/lyria-3-pro-preview:free,openrouter:google/lyria-3-pro-preview,gemini:lyria-3.5,elevenlabs:music_v1
      - key: LYRIA_MODEL # lyria-3.5 (full songs) or lyria-3-clip-preview (30 s, faster)
        value: lyria-3.5
